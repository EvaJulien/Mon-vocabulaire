<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plume &amp; Croc</title>
<meta name="theme-color" content="#14613f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plume &amp; Croc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3.3.0">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Plume &amp; Croc</h1>
        <button class="streak" id="sStreak" aria-label="Voir ta progression"></button>
        <div class="status" id="status">Chargement…</div>
      </div>
      <button class="gear" id="gear" aria-label="Réglages" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.830 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.510 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div class="boxes" id="boxes" aria-label="Tes mots par case"></div>
    <div class="trk" id="sTrack"></div>
    <div class="scorerow">
      <button class="sidebtn" id="bestBtn" aria-label="Bestiaire"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M9.5 7.5c1-1 3-1 4 0M9 11h.01M14 11h.01M10 13.5c1 .7 2.5.7 3.5 0"/></svg><small>Bestiaire</small></button>
      <button class="score" id="score" aria-label="Comment marchent les points ?"><b id="sScore">0</b><span><span id="sBest">points</span> <i class="qm" aria-hidden="true">?</i></span></button>
      <button class="sidebtn" id="lastBtn" aria-label="Dernier badge gagné"></button>
    </div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-v="rev">Vue</button>
      <button role="tab" aria-selected="false" data-v="ear">Ouïe</button>
      <button role="tab" aria-selected="false" data-v="hunt">Monstres</button>
      <button role="tab" aria-selected="false" data-v="lib">Bibliothèque</button>
      <button role="tab" aria-selected="false" data-v="add" class="plus" aria-label="Ajouter des mots">+</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="toast" role="status"><span id="toastT"></span><button id="toastB" type="button">Annuler</button></div>

<script src="app.js?v=3.3.0"></script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(function(r){ r.update(); }).catch(function(){}); });
}
</script>
</body>
</html>
